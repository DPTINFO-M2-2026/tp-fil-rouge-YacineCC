services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: discord-bot-db
    environment:
      POSTGRES_DB: discord_bot_db
      POSTGRES_USER: discord_bot
      POSTGRES_PASSWORD: discord_password
    ports:
      - "5432:5432"
    volumes:
      - discord-bot-pgdata:/var/lib/postgresql/data
    networks:
      - discord-bot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_bot -d discord_bot_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Ollama (LLM en Docker avec GPU NVIDIA)
  ollama:
    image: ollama/ollama:latest
    container_name: discord-bot-ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - discord-bot-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Pull du modèle Ollama au premier démarrage
  ollama-pull:
    image: ollama/ollama:latest
    container_name: discord-bot-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - discord-bot-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "🤖 Vérification du modèle llama3:8b sur le serveur Ollama..."
        if ! ollama --host http://ollama:11434 list | grep -q llama3:8b; then
          echo "📥 Téléchargement du modèle llama3:8b (cela peut prendre plusieurs minutes)..."
          ollama --host http://ollama:11434 pull llama3:8b
          echo "✅ Modèle llama3:8b téléchargé avec succès"
        else
          echo "✅ Modèle llama3:8b déjà présent"
        fi
    restart: "no"

  # Quarkus REST API
  app:
    build:
      context: .
      target: runtime
      dockerfile: Dockerfile
    container_name: discord-bot-app
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_USERNAME: discord_bot
      QUARKUS_DATASOURCE_PASSWORD: discord_password
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/discord_bot_db
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    networks:
      - discord-bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/users"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Discord Bot (ThrasherBot Reactive)
  bot:
    build:
      context: .
      target: bot
      dockerfile: Dockerfile
    container_name: discord-bot-thrasher
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      app:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      LANGCHAIN4J_HOST_IP: ollama
      LANGCHAIN4J_OLLAMA_PORT: "11434"
      LANGCHAIN4J_MODEL_NAME: llama3:8b
    volumes:
      - ./discord-bot-resources:/app/discord-bot-resources:ro
    networks:
      - discord-bot-network
    restart: unless-stopped

volumes:
  discord-bot-pgdata:
    driver: local
  ollama-data:
    driver: local

networks:
  discord-bot-network:
    driver: bridge

services:
  db:
    image: postgres:16-alpine
    container_name: discord-bot-db-prod
    environment:
      POSTGRES_DB: discord_bot_db
      POSTGRES_USER: discord_bot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-discord_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - discord-bot-pgdata-prod:/var/lib/postgresql/data
    networks:
      - discord-bot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_bot -d discord_bot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      target: runtime
      dockerfile: Dockerfile
    container_name: discord-bot-app-prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_USERNAME: discord_bot
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD:-discord_password}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/discord_bot_db
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - discord-bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Optionnel : PgAdmin pour gérer la base de données
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: discord-bot-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@discord-bot.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - discord-bot-pgadmin-data:/var/lib/pgadmin
    networks:
      - discord-bot-network
    depends_on:
      - db
    restart: unless-stopped
    profiles:
      - tools

volumes:
  discord-bot-pgdata-prod:
    driver: local
  discord-bot-pgadmin-data:
    driver: local

networks:
  discord-bot-network:
    driver: bridge

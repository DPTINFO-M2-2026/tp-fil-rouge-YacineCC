# Configuration de la base de données PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=discord_bot
quarkus.datasource.password=discord_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/discord_bot_db

# Configuration Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql

# Configuration REST
quarkus.rest-data-panache.default-page-size=20
quarkus.rest-data-panache.max-page-size=100

# Configuration du serveur
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,PUT,POST,DELETE
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Configuration de validation
quarkus.hibernate-validator.fail-fast=false

# Configuration de logging
quarkus.log.level=INFO
quarkus.log.category."fr.univtln.yhaouas846.projet".level=DEBUG
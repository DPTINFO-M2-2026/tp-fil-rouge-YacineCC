# Configuration de test avec base H2 en mémoire
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=test-data.sql

# Configuration pour les tests
quarkus.log.level=WARN
quarkus.log.category."fr.univtln.yhaouas846.projet".level=DEBUG

# Désactiver les fonctionnalités non nécessaires en test
quarkus.http.cors=false
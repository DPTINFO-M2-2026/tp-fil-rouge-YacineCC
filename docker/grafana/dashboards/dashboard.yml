# ================================
# Configuration Dashboards Grafana  
# ================================

apiVersion: 1

providers:
  - name: 'Discord Bot Dashboards'
    orgId: 1
    folder: 'Discord Bot'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
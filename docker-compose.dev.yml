services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: discord_bot_db
      POSTGRES_USER: discord_bot
      POSTGRES_PASSWORD: discord_password
    ports:
      - "5432:5432"
    volumes:
      - botdiscord-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_bot -d discord_bot_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_USERNAME: discord_bot
      QUARKUS_DATASOURCE_PASSWORD: discord_password
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/discord_bot_db
      QUARKUS_HTTP_HOST: 0.0.0.0
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      - ./:/workspace
      - botdiscord-m2:/root/.m2

volumes:
  botdiscord-pgdata:
  botdiscord-m2:

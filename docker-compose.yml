version: '3.8'

# ================================
# Docker Compose - Discord Bot Stack
# ================================
# Stack complète avec application, base de données et monitoring

services:
  # ================================
  # APPLICATION DISCORD BOT
  # ================================
  discord-bot:
    image: discord-bot:latest
    container_name: discord_bot_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"   # API REST
      - "8443:8443"   # HTTPS (optionnel)
      - "5005:5005"   # Debug JVM (dev uniquement)
    environment:
      # Configuration Quarkus
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8080
      
      # Configuration base de données
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_USERNAME: discord_bot
      QUARKUS_DATASOURCE_PASSWORD: discord_password_secure_2024
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/discord_bot_db
      
      # Configuration JPA/Hibernate
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: drop-and-create
      QUARKUS_HIBERNATE_ORM_LOG_SQL: true
      
      # Configuration JVM
      JAVA_OPTS_APPEND: >
        -Xms256m -Xmx512m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=100
        -Djava.util.logging.manager=org.jboss.logmanager.LogManager
    volumes:
      - discord_bot_logs:/app/logs
      - discord_bot_config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - discord-bot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.discord-bot.rule=Host(`discord-bot.local`)"
      - "traefik.http.services.discord-bot.loadbalancer.server.port=8080"

  # ================================
  # BASE DE DONNÉES POSTGRESQL
  # ================================
  postgres:
    image: postgres:15-alpine
    container_name: discord_bot_postgres
    environment:
      POSTGRES_DB: discord_bot_db
      POSTGRES_USER: discord_bot
      POSTGRES_PASSWORD: discord_password_secure_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/import.sql:/docker-entrypoint-initdb.d/01-import.sql:ro
    networks:
      - discord-bot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_bot -d discord_bot_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  # ================================
  # PGADMIN - ADMINISTRATION BDD
  # ================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: discord_bot_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin_secure_2024
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "8081:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    networks:
      - discord-bot-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.discord-bot.local`)"

  # ================================
  # MONITORING - PROMETHEUS (OPTIONNEL)
  # ================================
  prometheus:
    image: prom/prometheus:latest
    container_name: discord_bot_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - discord-bot
    networks:
      - discord-bot-network
    restart: unless-stopped
    profiles:
      - monitoring

  # ================================
  # GRAFANA - DASHBOARDS (OPTIONNEL)
  # ================================
  grafana:
    image: grafana/grafana:latest
    container_name: discord_bot_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: grafana_admin_2024
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - discord-bot-network
    restart: unless-stopped
    profiles:
      - monitoring

# ================================
# RÉSEAUX
# ================================
networks:
  discord-bot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ================================
# VOLUMES PERSISTANTS
# ================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  discord_bot_logs:
    driver: local
  discord_bot_config:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local